<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid from LESS</title>
    <style>
        * {
            box-sizing: border-box;

        }

        body {
            font-family: sans-serif;
        }

        .row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        [class*="col-"] {
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f8f9fa;
            text-align: center;
        }
    </style>

    <link rel="stylesheet/less" type="text/css" href="styles/grid.less" />

    <script src="https://cdn.jsdelivr.net/npm/less"></script>
</head>

<body>
    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <h2>Responsive Grid Columns (Generated by LESS)</h2>
        <p>Resize the browser to see the effect from our LESS generated grid columns.</p>

        <div class="row">
            <div class="col-xs-12 col-md-6 col-lg-3">col-xs-12 col-md-6 col-lg-3</div>
            <div class="col-xs-12 col-md-6 col-lg-3">col-xs-12 col-md-6 col-lg-3</div>
            <div class="col-xs-12 col-md-6 col-lg-3">col-xs-12 col-md-6 col-lg-3</div>
            <div class="col-xs-12 col-md-6 col-lg-3">col-xs-12 col-md-6 col-lg-3</div>
        </div>

        <div class="row">
            <div class="col-xs-6 col-sm-4 col-md-2">col-xs-6 sm-4 md-2</div>
            <div class="col-xs-6 col-sm-4 col-md-8">col-xs-6 sm-4 md-8</div>
            <div class="col-xs-12 col-sm-4 col-md-2">col-xs-12 sm-4 md-2</div>
        </div>
    </div>
</body>

</html>
