<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List PWA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header><h1>To Do List</h1></header>
    <form>
      <button id="testNotificationBtn" type="button">Test Notification</button>
      <div class="field-group">
        <label for="title">Task Title:</label>
        <input type="text" id="title" required />
      </div>
      <div class="row">
        <div class="field-group">
          <label for="hour">Hours (HH)</label>
          <input type="number" id="hour" min="0" max="23" required />
        </div>
        <div class="field-group">
          <label for="minute">Minutes (MM)</label>
          <input type="number" id="minute" min="0" max="59" required />
        </div>
      </div>
      <div class="field-group">
        <label for="date">Due Date</label>
        <input type="date" id="date" required />
      </div>
      <button type="submit">Add Task</button>
    </form>
    <table id="todoTable">
      <thead>
        <tr>
          <th>Task Title</th>
          <th>Due Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Todo items will be dynamically inserted here -->
      </tbody>
    </table>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .then((registration) => {
          console.log("Service Worker registered:", registration);
        })
        .catch((error) => {
          console.error("Service Worker registration failed:", error);
        });
    }
  </script>
  <script src="idb.js"></script>
  <script src="main.js"></script>
</body>
</html>
